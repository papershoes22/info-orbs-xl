<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Info Orbs</title>
<style>
:root{--bg:#0b0e14;--card:#141922;--card2:#1b2230;--line:#263043;--text:#e7ecf3;--dim:#93a0b4;--faint:#5f6b7e;
--accent:#4aff00;--accent-ink:#0b1400;--bad:#ff5a5f;--warn:#ffc34d;--ok:#3ddc84;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 10px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:.2px}
.conn{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--dim)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.bad{background:var(--bad)}
.orbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 12px}
.orb{aspect-ratio:1;border-radius:50%;background:#000;border:2px solid #222b3a;overflow:hidden;position:relative}
.orb img{width:100%;height:100%;object-fit:cover;display:block}
.orb span{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:10px;color:#ffffffaa;text-shadow:0 0 3px #000}
.top{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -14px 12px;padding:6px 14px;border-bottom:1px solid var(--line)}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:999px;
padding:10px 4px;font:inherit;font-size:14px;min-height:44px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 6px}
.trybox{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:14px}
.trybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#2b2410;border:1px solid #5a4a1d;color:#ffe7a8;border-radius:12px;padding:8px 10px;margin:0 0 6px;font-size:14px}
.trybar span{flex:1 1 auto}
.sub{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:2px 12px;margin:6px 0 10px}
.sub h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);margin:10px 0 2px;font-weight:600}
.days{display:flex;gap:4px;flex-wrap:wrap}.days button{min-width:40px}
.sub .seg button{padding:8px 8px;min-width:0}.sub .row .lbl{white-space:nowrap}
textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-height:64px}
nav button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px;margin:0 0 12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:12px 0 4px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:8px 0;border-top:1px solid var(--line)}
.card h2+.row,.card .row:first-child{border-top:0}
.row label,.row .lbl{flex:1 1 auto;min-width:0}
.row .lbl small,.note{display:block;color:var(--faint);font-size:13px;margin-top:2px}
.ctl{flex:0 0 auto;display:flex;align-items:center;gap:8px}
select,input[type=text],input[type=number],input[type=time],input[type=datetime-local]{font:inherit;color:var(--text);background:var(--card2);
border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px;max-width:210px}
input[type=number]{width:96px}input[type=text]{width:190px}input.wide-num{width:132px}
input[type=color]{width:52px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card2);padding:4px}
input[type=range]{width:170px;accent-color:var(--accent);height:44px}
.val{min-width:42px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.sw{position:relative;width:60px;height:44px;flex:0 0 auto}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.sw i{position:absolute;left:0;right:0;top:6px;bottom:6px;border-radius:999px;background:#334055;transition:.15s}
.sw i:after{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--accent)}.sw input:checked+i:after{left:31px;background:var(--accent-ink)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--dim);font:inherit;font-size:14px;padding:8px 11px;border-radius:8px;min-height:40px;min-width:44px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.btn{font:inherit;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
.btn.danger{border-color:#5a2a30;color:#ffb3b6}
.btn:disabled{opacity:.45}
.sets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px 0}
.sets button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:12px;min-height:56px;cursor:pointer}
.sets button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sets button:disabled{opacity:.4}
.sets button small{display:block;color:var(--faint);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px 0}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:12px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.stat span{display:block;margin-top:2px;overflow-wrap:anywhere}
.order .row .ctl .btn{padding:8px 12px;min-width:44px}
.err{color:var(--bad);font-size:13px;display:block}
.results{padding:0 0 8px}.results button{display:block;width:100%;text-align:left;margin:6px 0}
.banner{display:none;background:#3a1b1f;border:1px solid #5a2a30;color:#ffd6d8;border-radius:12px;padding:10px 12px;margin:0 0 12px}
.banner.on{display:block}
#toast{display:none;margin:8px 0 2px;padding:9px 12px;border-radius:12px;background:#16301b;border:1px solid #2c5a33;color:#c9f5cf;font-size:14px}
#toast.on{display:block}#toast.bad{background:#3a1b1f;border-color:#5a2a30;color:#ffd6d8}
.wide{width:100%}.mono{font-variant-numeric:tabular-nums}
.press{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 0}
.pcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.pcol b{font-size:12px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.8px;text-align:center}
.pcol .btn{padding:10px 4px;white-space:nowrap}
@media (max-width:420px){.row{flex-wrap:wrap}.row .ctl{width:100%;justify-content:flex-end}input[type=range]{flex:1;width:auto}.row .ctl.full{justify-content:stretch}}
@media (min-width:700px){.sets{grid-template-columns:repeat(5,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Info Orbs</h1><div class="conn"><span class="dot" id="dot"></span><span id="conn">Connecting…</span></div></header>
<div class="banner" id="banner"></div>
<div class="orbs" id="orbs"></div>
<div class="top"><div id="tools"></div><nav id="tabs"></nav><div id="toast" role="status" aria-live="polite"></div></div>
<main id="main"></main>
</div>
<script>
"use strict";
const $ = (s, e = document) => e.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
let S = null, ST = null, META = null, tab = "now", online = false;
const get = (path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), S);
function patchOf(path, value) {               // "clock.color" -> {clock: {color: value}}
  const keys = path.split("."), out = {};
  let o = out;
  keys.slice(0, -1).forEach((k) => (o = o[k] = {}));
  o[keys[keys.length - 1]] = value;
  return out;
}
let toastT;
function toast(msg, bad) {
  const t = $("#toast"); t.textContent = msg; t.className = "on" + (bad ? " bad" : "");
  clearTimeout(toastT); toastT = setTimeout(() => (t.className = bad ? "bad" : ""), bad ? 4000 : 1400);
}
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {cache: "no-store"} :
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error("the orbs answered " + r.status);
  return r.json();
}
const errs = {};
// redraw: false for a field that already shows what was picked (colour, slider, number, text, list): redrawing would
// replace it, and on a phone that closes an open colour picker mid-drag (2026-11-17)
const HIST = [];                               // undo: the last 20 changes (where, what it was before)
let undoing = false;
const deep = (x) => (x === undefined ? undefined : JSON.parse(JSON.stringify(x)));
async function change(path, value, redraw = true) {
  let ok = false;
  const before = deep(get(path));
  try {
    const r = await api("/api/settings", patchOf(path, value));
    if (r.ok) { S = r.settings; ok = true; const had = path in errs; delete errs[path];
      if (!undoing && JSON.stringify(before) !== JSON.stringify(value)) { HIST.push({path, before}); if (HIST.length > 20) HIST.shift(); }
      toast(ST && ST.try && ST.try.active ? "On the orbs: trying, not saved yet" : "Saved on the orbs"); if (had) redraw = true; drawTools(); }
    else { Object.assign(errs, r.errors || {}); toast(Object.values(r.errors || {})[0] || "Not saved", true); }
  } catch (e) { toast("Not saved: " + e.message, true); }
  if (redraw || !ok) render();
}
async function undo() {
  const h = HIST.pop(); if (!h) return;
  undoing = true;
  try { await change(h.path, h.before); } finally { undoing = false; }
  render();
}
function drawTools() {
  const t = (ST && ST.try) || {active: false};
  $("#tools").replaceChildren(
    el("div", {class: "tools"},
      el("div", {class: "trybox"}, el("span", {}, "Try first"), el("label", {class: "sw"}, el("input", {type: "checkbox", checked: !!t.active,
        "aria-label": "try first", onchange: (e) => act({do: e.target.checked ? "try" : "keep"},
          e.target.checked ? "Trying: changes show but aren't saved" : "Kept and saved")}), el("i"))),
      el("button", {class: "btn", type: "button", disabled: !HIST.length, "aria-label": "undo", onclick: undo},
        HIST.length ? `Undo (${HIST.length})` : "Undo")),
    t.active ? el("div", {class: "trybar"}, el("span", {}, `Trying: back to the saved settings in ${t.left_s ?? 30} s unless kept`),
      el("button", {class: "btn primary", type: "button", "aria-label": "keep", onclick: () => act({do: "keep"}, "Kept and saved")}, "Keep"),
      el("button", {class: "btn", type: "button", "aria-label": "put back", onclick: () => act({do: "revert"}, "Put back")}, "Put back")) : "");
}
const debounced = {};
function changeSoon(path, value, ms = 350) { clearTimeout(debounced[path]); debounced[path] = setTimeout(() => change(path, value, false), ms); }
async function act(body, ok) {
  try { const r = await api("/api/action", body); if (r.ok) { if (ok) toast(ok); poll(); } else toast(r.error || "The orbs said no", true); }
  catch (e) { toast(e.message, true); }
}

/* ---- controls ---- */
function row(label, note, ctl, path) {
  return el("div", {class: "row"}, el("div", {class: "lbl"}, label, note ? el("small", {}, note) : null,
    path && errs[path] ? el("span", {class: "err"}, errs[path]) : null), el("div", {class: "ctl"}, ctl));
}
function sw(path, onchange) {
  return el("label", {class: "sw"}, el("input", {type: "checkbox", checked: !!get(path), "aria-label": path,
    onchange: (e) => (onchange ? onchange(e.target.checked) : change(path, e.target.checked))}), el("i"));
}
function seg(path, opts, onpick, shown) {
  const cur = shown !== undefined ? shown : get(path);
  return el("div", {class: "seg", role: "group"}, opts.map(([v, t]) => el("button", {class: String(cur) === String(v) ? "on" : "",
    type: "button", onclick: () => (onpick ? onpick(v) : change(path, v))}, t)));
}
function sel(path, opts, onpick) {
  const cur = get(path);
  return el("select", {"aria-label": path, onchange: (e) => (onpick ? onpick(e.target.value) : change(path, e.target.value, false))},
    opts.map(([v, t]) => el("option", {value: v, selected: String(cur) === String(v)}, t)));
}
function num(path, min, max, step = 1) {
  return el("input", {type: "number", min, max, step, value: get(path), inputmode: step === "any" ? "decimal" : "numeric", "aria-label": path,
    class: step === "any" ? "wide-num" : null,
    onchange: (e) => change(path, Number(e.target.value), false)});
}
function txt(path, max) {
  return el("input", {type: "text", maxlength: max, value: get(path) ?? "", "aria-label": path, autocapitalize: "off",
    spellcheck: "false", onchange: (e) => change(path, e.target.value.trim(), false)});
}
function color(path) {
  // the orbs follow while the colour is dragged; the picker's own "done" (change) sends the final one at once
  return el("input", {type: "color", value: get(path), "aria-label": path,
    oninput: (e) => changeSoon(path, e.target.value, 200),
    onchange: (e) => { clearTimeout(debounced[path]); change(path, e.target.value, false); }});
}
function slider(path, min, max, fmt = (v) => v) {
  const out = el("span", {class: "val"}, fmt(get(path)));
  return [el("input", {type: "range", min, max, value: get(path), "aria-label": path,
    oninput: (e) => { out.textContent = fmt(Number(e.target.value)); changeSoon(path, Number(e.target.value)); }}), out];
}
const setTitle = (k) => (META.sets.find((s) => s.key === k) || {title: k}).title;
const camTitle = (id) => (META.cams.find((c) => c.id === id) || {title: id}).title;
const ago = (s) => s == null ? "–" : s < 90 ? `${Math.round(s)} s ago` : s < 5400 ? `${Math.round(s / 60)} min ago` : `${(s / 3600).toFixed(1)} h ago`;
const upFor = (s) => s < 3600 ? `${Math.round(s / 60)} min` : s < 172800 ? `${(s / 3600).toFixed(1)} h` : `${(s / 86400).toFixed(1)} days`;

/* ---- tabs ---- */
const TABS = [["now", "Now"], ["sets", "Sets"], ["rules", "Rules"], ["messages", "Messages"], ["clock", "Clock"],
  ["weather", "Weather"], ["matrix", "Matrix"], ["rig", "Rig"], ["screens", "Screens"], ["system", "System"]];
const ACTION_TITLES = {own: "As always", nothing: "Nothing", prev_set: "Previous set", next_set: "Next set", qr: "Settings QR code",
  dark: "Screens dark / on", play_pause: "Music play / pause", next_track: "Next song", prev_track: "Previous song",
  cams_page: "Next camera page", clock_style: "Clock: Normal / Nixie", clock_format: "Clock: 12 / 24 h", middle_page: "Rig stats: middle orb's page",
  brighter: "Brighter", dimmer: "Dimmer"};
const THEME_TITLES = {own: "The set's own", ember: "Ember", ocean: "Ocean", forest: "Forest", mono: "Mono", neon: "Neon", sunset: "Sunset", ice: "Ice"};
const STYLE_OPTS = [["own", "Own"], ["ring", "Ring"], ["needle", "Needle"], ["bar", "Bar"], ["number", "Number"]];
let openSet = null;
const per = (k, f) => `sets.per.${k}.${f}`;
// what each of the XL's own five screens shows (weather.cpp, sets_new.cpp), in the order they're drawn
const SCREEN_NAMES = {
  weather: ["Time and date", "Weather in words, the city", "Weather picture", "Temperature, today's high and low",
    "The next three days"],
  hourly: ["Next hour", "In 2 hours", "In 3 hours", "In 4 hours", "In 5 hours"],
  sky: ["Sunrise and day length", "Sunset", "The moon", "UV index", "Air quality"]};
function faceOptions(k) {
  const m = META.sets.find((s) => s.key === k) || {};
  if (m.orbs === "screens") return [0, 1, 2, 3, 4].map((i) => [i, (SCREEN_NAMES[k] || [])[i] || `Screen ${i + 1}`]);
  if (k === "messages") return [["blank", "Blank"], ...[...Array(8).keys()].map((i) => { const c = S.custom[i] || {};
    return [i, `Message ${i + 1}${c.kind === "none" ? " (empty)" : ": " + (c.title || c.text || "").slice(0, 18)}`]; })];
  const cat = ST.catalog && ST.catalog.sets && ST.catalog.sets[k];
  const names = cat && cat.faces && cat.faces.length ? cat.faces : [0, 1, 2, 3, 4].map((i) => `Face ${i + 1}`);
  // (the rig's list is by face id, with gaps; its "Message N" faces are the Messages tab's, shown with their words)
  const named = (t, i) => { const m = /^Message (\d)$/.exec(t || ""); if (!m) return t; const c = S.custom[Number(m[1]) - 1] || {};
    return `${t}${c.kind === "none" ? " (empty)" : ": " + (c.title || c.text || "").slice(0, 18)}`; };
  return [["blank", "Blank"], ...names.map((t, i) => [i, named(t, i)]).filter(([, t]) => t)];
}
function setPanel(k) {
  const m = META.sets.find((s) => s.key === k) || {};
  const faces = get(per(k, "faces")), styles = get(per(k, "styles")), own = get(per(k, "brightness")) > 0;
  // (what the rig can do for this set, from its catalogue: colour themes, gauge styles; nothing offered that does nothing)
  const cat = (ST.catalog && ST.catalog.sets && ST.catalog.sets[k]) || {};
  const placeFace = (i, v) => {
    const f = faces.slice(), nv = v === "blank" ? "blank" : Number(v);
    if (m.orbs === "screens") { const j = f.indexOf(nv); if (j >= 0) f[j] = f[i]; }   // (each screen once: the two swap)
    f[i] = nv; change(per(k, "faces"), f);
  };
  const btnSel = (b, kind) => {
    const path = `${per(k, "buttons")}.${b}.${kind}`;
    const opts = [...META.actions.map((a) => [a, ACTION_TITLES[a] || a]), ...META.sets.map((s) => [`show:${s.key}`, `Show ${s.title}`])];
    return sel(path, opts);
  };
  return el("div", {class: "sub"},
    el("h3", {}, "Its turn and brightness"),
    row("Its turn in the cycle", "0 = the general setting (Going round by themselves)", [num(per(k, "cycle_s"), 0, 3600), el("span", {class: "val"}, "s")], per(k, "cycle_s")),
    row("Its own brightness", own ? null : "Off: the general brightness", el("label", {class: "sw"}, el("input", {type: "checkbox", checked: own,
      "aria-label": `${k} own brightness`, onchange: (e) => change(per(k, "brightness"), e.target.checked ? 160 : 0)}), el("i"))),
    own ? row("Brightness", null, slider(per(k, "brightness"), 10, 255, (v) => `${Math.round(v / 2.55)} %`), per(k, "brightness")) : null,
    m.rig && cat.themes ? row("Colours", "The rig draws this set in these colours", sel(per(k, "theme"), META.themes.map((t) => [t, THEME_TITLES[t] || t])), per(k, "theme")) : null,
    el("h3", {}, "Which face on which orb"),
    m.orbs === "together" ? el("small", {class: "note"}, "This set's five orbs make one picture together: nothing to place.")
      : (ST.catalog && ST.catalog.sets && ST.catalog.sets[k] && ST.catalog.sets[k].note) ? el("small", {class: "note"}, ST.catalog.sets[k].note)
      : [0, 1, 2, 3, 4].map((i) => row(`Orb ${i + 1}`, null, sel(`${per(k, "faces")}.${i}`, faceOptions(k), (v) => placeFace(i, v)), per(k, "faces"))),
    m.rig && cat.styles ? [el("h3", {}, "Gauge style"), el("small", {class: "note"}, "On faces with a gauge: a ring, a needle, a bar, or the number alone."),
      [0, 1, 2, 3, 4].map((i) => row(`Orb ${i + 1}`, null, seg(`${per(k, "styles")}.${i}`, STYLE_OPTS,
        (v) => { const g = styles.slice(); g[i] = v; change(per(k, "styles"), g); })))] : null,
    el("h3", {}, "Buttons on this set"),
    ...["left", "middle", "right"].flatMap((b) => ["short", "medium", "long"].map((kind) =>
      row(`${b[0].toUpperCase() + b.slice(1)}, ${kind === "short" ? "a press" : kind === "medium" ? "held ½ s" : "held 2 s"}`, null, btnSel(b, kind), `${per(k, "buttons")}.${b}.${kind}`))));
}
// the orbs' three buttons from here: each goes through the orbs' own press code, so it does exactly what that press on
// the real button does on the set showing (the 15 s hold that wipes everything is left out on purpose)
const PRESS_KINDS = [["short", "Press"], ["medium", "Hold ½ s"], ["long", "Hold 2 s"]];
function pressCard() {
  return el("div", {class: "card"}, el("h2", {}, "Press a button"),
    el("small", {class: "note"}, "The same as pressing the orbs' own buttons, on the set showing now."),
    el("div", {class: "press"}, ["left", "middle", "right"].map((b) => {

      el("div", {class: "card"}, el("h2", {}, "Passwords and keys"),
        el("small", {class: "note"}, "Not on this page. Over USB from a PC: orbs_xl.py wifi (Wi-Fi), orbs_xl.py key (weather), orbs_xl.py frigate (camera backup). If the orbs can't join Wi-Fi they open a setup hotspot; its password shows on the orbs.")),
    ];
  },
};
let PRESETS = null;
async function loadPresets() { try { PRESETS = (await api("/api/presets")).presets; } catch (e) { PRESETS = []; } if (tab === "system" || tab === "now") render(); }
async function presetDo(body, ok) {
  try { const r = await api("/api/presets", body); PRESETS = r.presets; if (r.ok) { toast(ok); if (body.do === "apply") { await poll(); } } else toast(r.error || "The orbs said no", true); }
  catch (e) { toast(e.message, true); }
  render();
}
function presetsCard() {
  if (PRESETS === null) { loadPresets(); return el("div", {class: "card"}, el("h2", {}, "Presets"), el("small", {class: "note"}, "Loading…")); }
  const name = el("input", {type: "text", maxlength: 23, placeholder: "Name, e.g. Gaming", "aria-label": "preset name"});
  const free = PRESETS.findIndex((p) => !p);
  return el("div", {class: "card"}, el("h2", {}, "Presets"),
    el("small", {class: "note"}, "A preset keeps the whole look: sets, faces, colours, brightness, rules. Applying one keeps your Wi-Fi, time zone and weather place."),
    PRESETS.map((p, i) => p ? row(p.name, `Preset ${i + 1}`, [
      el("button", {class: "btn primary", type: "button", "aria-label": `preset ${i} apply`, onclick: () => presetDo({do: "apply", slot: i}, `${p.name} on`)}, "Apply"),
      el("button", {class: "btn", type: "button", "aria-label": `preset ${i} save`, onclick: () => confirm(`Save the current look into ${p.name}?`) && presetDo({do: "save", slot: i, name: p.name}, "Saved")}, "Save over"),
      el("button", {class: "btn danger", type: "button", "aria-label": `preset ${i} delete`, onclick: () => confirm(`Delete ${p.name}?`) && presetDo({do: "delete", slot: i}, "Deleted")}, "Delete")]) : null),
    el("div", {class: "row"}, name, el("button", {class: "btn primary", type: "button", disabled: free < 0, "aria-label": "preset save new",
      onclick: () => name.value.trim() && presetDo({do: "save", slot: free, name: name.value.trim()}, "Preset saved")}, free < 0 ? "All 8 used" : "Save the look")));
}
function presetsQuick() {
  if (PRESETS === null) { loadPresets(); return null; }
  const have = PRESETS.map((p, i) => p ? [p, i] : null).filter(Boolean);
  if (!have.length) return null;
  return el("div", {class: "card"}, el("h2", {}, "Presets"), el("div", {class: "sets"}, have.map(([p, i]) =>
    el("button", {type: "button", "aria-label": `preset ${i} quick`, onclick: () => presetDo({do: "apply", slot: i}, `${p.name} on`)}, p.name))));
}
function stat(t, v) { return el("div", {class: "stat"}, el("b", {}, t), el("span", {class: "mono"}, v ?? "–")); }

function render() {
  if (!S) return;
  const focus = document.activeElement && document.activeElement.getAttribute("aria-label");
  $("#tabs").replaceChildren(...TABS.map(([k, t]) => el("button", {class: tab === k ? "on" : "", type: "button",
    onclick: () => { tab = k; try { localStorage.setItem("tab", k); } catch (e) {} render(); }}, t)));
  drawTools();
  $("#main").replaceChildren(el("section", {class: "on"}, VIEWS[tab]()));
  if (focus) { const f = $(`[aria-label="${CSS.escape(focus)}"]`); if (f && f.type !== "range") f.focus({preventScroll: true}); }
}
function orbs() {
  const box = $("#orbs");
  if (!box.children.length) for (let i = 0; i < 5; i++) box.append(el("div", {class: "orb"}, el("img", {alt: `orb ${i + 1}`}), el("span", {}, `D${i + 1}`)));
  // one after another (the XL serves a few connections at a time; five at once got some turned away)
  if (orbsLoading) return;
  orbsLoading = true;
  const imgs = [...box.querySelectorAll("img")];
  const next = (i) => {
    if (i >= imgs.length) { orbsLoading = false; return; }
    const n = new Image();
    n.onload = () => { imgs[i].src = n.src; next(i + 1); };
    n.onerror = () => next(i + 1);
    n.src = `/api/orb/${i}?t=${Date.now()}`;
  };
  next(0);
}
let orbsLoading = false;
let pointerDown = false;                      // (no redraw under a finger: a slider being dragged)
document.addEventListener("pointerdown", () => (pointerDown = true), true);
document.addEventListener("pointerup", () => (pointerDown = false), true);
document.addEventListener("pointercancel", () => (pointerDown = false), true);
const editing = () => pointerDown || (document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName));
async function poll() {
  try {
    const r = await api("/api/state");
    ST = r.status; META = r.meta;
    if (!S || !editing()) S = r.settings;
    online = true;
  } catch (e) { online = false; }
  $("#dot").className = "dot " + (online ? "ok" : "bad");
  $("#conn").textContent = online ? `${ST.time} · ${setTitle(ST.showing)}` : "Not answering";
  const b = $("#banner"); b.className = "banner" + (online ? "" : " on");
  b.textContent = online ? "" : "The orbs aren't answering. Is the XL on and on the same Wi-Fi?";
  if ((tab === "now" || tab === "system") && !editing()) render();
  else if (!editing()) drawTools();
}
async function load() { await poll(); render(); orbs(); }
try { tab = localStorage.getItem("tab") || "now"; } catch (e) {}
if (!TABS.some(([k]) => k === tab)) tab = "now";
load();
setInterval(poll, 3000);
setInterval(() => { if (!document.hidden) orbs(); }, 3000);
</script>
